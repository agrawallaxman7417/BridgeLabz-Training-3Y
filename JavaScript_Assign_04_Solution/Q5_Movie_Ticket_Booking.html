<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 14px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; }
        .error { color: #b00020; }
        #ticket { margin-top: 20px; padding: 14px; border: 1px dashed #555; }
        button { margin-top: 16px; padding: 10px 16px; }
    </style>
</head>
<body>
    <h1>Movie Ticket Booking</h1>
    <form id="bookingForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name">
        <div class="error" id="nameError"></div>

        <label for="email">Email</label>
        <input id="email" name="email">
        <div class="error" id="emailError"></div>

        <label for="seats">Seats (1–10)</label>
        <input id="seats" name="seats" type="number" min="1" max="10">
        <div class="error" id="seatsError"></div>

        <button type="submit">Book Tickets</button>
    </form>
    <section id="ticket" hidden></section>
    <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>
