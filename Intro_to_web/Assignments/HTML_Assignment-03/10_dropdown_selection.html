<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection Page</title>
</head>
<body>
    <!-- Dropdown selection heading -->
    <h1>Choose Your Travel Preferences</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city" name="city">
        <option selected>Mathura</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
        <option>Kochi</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Gateway of India</option>
        <option>Kerala Backwaters</option>
    </select>

    <!-- Summary of selected choices -->
    <p>My choices are: Country - India, State - Uttar Pradesh, City - Mathura, Favorite Tourist Place - Taj Mahal.</p>
</body>
</html>
