<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <!-- School heading -->
    <h1>GLA Senior Secondary School</h1>

    <!-- Student marks report -->
    <table border="1" title="Student Academic Report">
        <caption>Student Report Card</caption>
        <thead>
            <tr>
                <th rowspan="2">Student</th>
                <th colspan="5">Subject Marks</th>
                <th rowspan="2">Result</th>
            </tr>
            <tr>
                <th>English</th>
                <th>Mathematics</th>
                <th>Science</th>
                <th>Computer</th>
                <th>Social Studies</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laxman Agrawal</td>
                <td>82</td>
                <td>88</td>
                <td>79</td>
                <td>91</td>
                <td>84</td>
                <td>Pass</td>
            </tr>
            <tr>
                <td colspan="5"><strong>Total and Percentage</strong></td>
                <td colspan="2">424 / 500 = 84.8%</td>
            </tr>
        </tbody>
    </table>

    <!-- Additional report note -->
    <p title="Teacher's remark">Remark: Good performance. Keep improving.</p>
</body>
</html>
