<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Shadows & Depth Effects</h1></header>
  <main>
    <section class="cards">
      <article class="card soft"><h2>Soft Shadow</h2><p>A gentle shadow creates a clean floating effect.</p></article>
      <article class="card sharp"><h2>Sharp Shadow</h2><p>A stronger shadow gives the card more definition.</p></article>
      <article class="card glow"><h2>Layered Shadow</h2><p>Multiple shadows create extra visual depth.</p></article>
    </section>
  </main>
  <footer><p>Hover over a card to lift it.</p></footer>
</body>
</html>
