<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Height & Width Practice</h1></header>
  <main>
    <section class="layout">
      <div class="box box-one"><h2>180px × 180px</h2><p>Fixed pixel size.</p></div>
      <div class="box box-two"><h2>40vh × 30%</h2><p>Uses viewport height and percentage width.</p></div>
      <div class="box box-three"><h2>12em width</h2><p>This box demonstrates min-height, max-width and overflow. Extra content is clipped when necessary.</p></div>
    </section>
  </main>
  <footer><p>Size Units Practice</p></footer>
</body>
</html>
