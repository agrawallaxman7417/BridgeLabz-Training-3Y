<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline and Focus Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Outline & Focus Styling</h1></header>
  <main>
    <section class="form-card">
      <h2>Contact Form</h2>
      <form>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
  <footer><p>Focus styling is visible when an element is selected.</p></footer>
</body>
</html>
