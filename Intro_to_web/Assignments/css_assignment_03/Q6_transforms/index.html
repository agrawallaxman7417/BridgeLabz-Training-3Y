<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>CSS Transformations Showcase</h1></header>
  <main>
    <section class="transform-container">
      <div class="demo"><div class="box rotate">Rotate</div><p>rotate()</p></div>
      <div class="demo"><div class="box scale">Scale</div><p>scale()</p></div>
      <div class="demo"><div class="box translate">Move</div><p>translate()</p></div>
      <div class="demo"><div class="box skew">Skew</div><p>skew()</p></div>
    </section>
  </main>
  <footer><p>Hover over each box.</p></footer>
</body>
</html>
