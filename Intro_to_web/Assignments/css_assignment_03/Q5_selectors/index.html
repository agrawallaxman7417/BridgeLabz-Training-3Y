<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Advanced CSS Selectors</h1></header>
  <main>
    <section class="selector-demo">
      <h2>Form</h2>
      <input type="text" placeholder="Text input">
      <input type="email" placeholder="Email input">
      <p class="note">This paragraph has a <span>descendant span</span>.</p>
      <p class="note">Second paragraph</p>
      <a href="https://example.com">Secure HTTPS Link</a>
      <a href="http://example.com">HTTP Link</a>
      <ul class="items">
        <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
      </ul>
    </section>
  </main>
  <footer><p>Selector Practice</p></footer>
</body>
</html>
