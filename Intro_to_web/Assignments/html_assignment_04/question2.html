<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>My City Map</h1>
    <!-- loading="lazy" delays loading until the map is close to being visible -->
    <iframe src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
            title="Google Map of Mathura" width="600" height="450" loading="lazy"></iframe>
</body>
</html>
