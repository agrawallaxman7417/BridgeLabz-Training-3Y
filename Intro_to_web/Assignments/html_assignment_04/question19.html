<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>
    <h1>Secure Form</h1>
    <!-- autocomplete="off" prevents automatic browser form filling -->
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <p>Turning off autocomplete can reduce the chance of sensitive form information being automatically stored or filled by the browser.</p>
</body>
</html>
