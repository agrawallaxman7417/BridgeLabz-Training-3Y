<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <h1>Simple Form</h1>
    <!-- Form submits the result to the iframe below -->
    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name">
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <br>
    <!-- Result page loads inside this iframe -->
    <iframe src="" name="resultFrame" width="500" height="150" title="Form Result"></iframe>
</body>
</html>
