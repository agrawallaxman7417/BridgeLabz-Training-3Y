<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Website</title>
</head>
<!-- Frameset divides the browser window into rows -->
<frameset rows="25%,75%">
    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" name="navigation">
    <!-- Bottom frame displays the welcome message -->
    <frame src="welcome.html" name="content">
</frameset>
</html>
