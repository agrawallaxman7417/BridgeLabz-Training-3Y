<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>
    <!-- Spaces and special characters are encoded in a URL -->

        Encoded URL:
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML &amp; CSS</a>
    </p>
</body>
</html>
