<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>
    <main>
        <header><h1>Our Team</h1><p>Hover over a profile to reveal the original image.</p></header>
        <section class="profiles">
            <article class="profile">
                <img class="gray" src="https://i.pravatar.cc/500?img=12" alt="Alex profile">
                <div><h2>Alex</h2><p>UI Designer</p></div>
            </article>
            <article class="profile">
                <img class="sepia" src="https://i.pravatar.cc/500?img=32" alt="Sam profile">
                <div><h2>Sam</h2><p>Frontend Developer</p></div>
            </article>
            <article class="profile">
                <img class="gray" src="https://i.pravatar.cc/500?img=47" alt="Jordan profile">
                <div><h2>Jordan</h2><p>Product Manager</p></div>
            </article>
        </section>
    </main>
</body>
</html>
