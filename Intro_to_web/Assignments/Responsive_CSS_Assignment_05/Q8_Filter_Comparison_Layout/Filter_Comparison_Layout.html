<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>
<body>
    <main>
        <header><h1>Filter Comparison</h1><p>Compare the original and filtered image.</p></header>
        <section class="comparison">
            <figure><img src="https://picsum.photos/id/1018/700/450" alt="Original landscape"><figcaption>Before — Original</figcaption></figure>
            <figure><img class="filtered" src="https://picsum.photos/id/1018/700/450" alt="Filtered landscape"><figcaption>After — Filtered</figcaption></figure>
        </section>
    </main>
</body>
</html>
