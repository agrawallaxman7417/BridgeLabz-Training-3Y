<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light"><header class="bg-dark text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3 mb-0">Task Tracker</h1><span>Pending <span class="badge bg-danger">5</span></span></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="mb-4">My Tasks</h2><div class="list-group mb-4"><div class="list-group-item d-flex justify-content-between align-items-center"><span>Finish landing page</span><span class="badge text-bg-danger rounded-pill">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Review pull requests</span><span class="badge text-bg-warning rounded-pill">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Update documentation</span><span class="badge text-bg-success rounded-pill">Low</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Practice algorithms</span><span class="badge text-bg-danger rounded-pill">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center"><span>Plan sprint</span><span class="badge text-bg-warning rounded-pill">Medium</span></div></div><button class="btn btn-success">Completed <span class="badge text-bg-light">8</span></button></div></div></div></div></main><footer class="py-4 text-center">Stay organized. Keep shipping.</footer></body></html>
