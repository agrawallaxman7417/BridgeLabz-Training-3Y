<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <header class="topbar">
        <h1>Admin Dashboard</h1>
    </header>

    <div class="dashboard">
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Orders</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="content">
            <h2>Overview</h2>
            <section class="boxes">
                <article class="box">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </article>
                <article class="box">
                    <h3>Total Sales</h3>
                    <p>₹85,000</p>
                </article>
                <article class="box">
                    <h3>Orders</h3>
                    <p>450</p>
                </article>
                <article class="box">
                    <h3>Revenue</h3>
                    <p>₹1,20,000</p>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
