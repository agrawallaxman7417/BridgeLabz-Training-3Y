<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <main class="pricing-page">
        <h1>Choose Your Plan</h1>

        <section class="plans">
            <article class="plan">
                <h2>Basic</h2>
                <div class="price">₹499 <span>/month</span></div>
                <ul>
                    <li>5 Projects</li>
                    <li>Basic Support</li>
                    <li>5 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </article>

            <article class="plan popular">
                <h2>Standard</h2>
                <div class="price">₹999 <span>/month</span></div>
                <ul>
                    <li>20 Projects</li>
                    <li>Priority Support</li>
                    <li>50 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </article>

            <article class="plan">
                <h2>Premium</h2>
                <div class="price">₹1,999 <span>/month</span></div>
                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>200 GB Storage</li>
                </ul>
                <a href="#">Choose Plan</a>
            </article>
        </section>
    </main>
</body>
</html>
