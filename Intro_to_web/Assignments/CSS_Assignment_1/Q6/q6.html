<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main>
        <h1>CSS Photo Gallery</h1>

        <section class="gallery">
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=1" alt="Mountain"><figcaption>Mountain View</figcaption></div></figure>
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=2" alt="Forest"><figcaption>Green Forest</figcaption></div></figure>
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=3" alt="Beach"><figcaption>Sunny Beach</figcaption></div></figure>
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=4" alt="City"><figcaption>City Lights</figcaption></div></figure>
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=5" alt="Lake"><figcaption>Peaceful Lake</figcaption></div></figure>
            <figure><div class="image-box"><img src="https://picsum.photos/500/350?random=6" alt="Road"><figcaption>Open Road</figcaption></div></figure>
        </section>
    </main>
</body>
</html>
